# Platform stack: edge proxy, availability monitoring, log pipeline.
# Docker Swarm stack in Compose format; the filename lets Dependabot track images.
# Deploy with scripts/bootstrap-platform.sh (renders ${DOMAIN} into dynamic/platform.yml).
#
# Images are pinned by digest. Dependabot opens PRs for new digests; review the
# upstream release notes and the smoke test before merging.
services:
  traefik:
    image: traefik:v3.7.19@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DEPLOY_ROOT}/deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${DEPLOY_ROOT}/dynamic:/etc/traefik/dynamic:ro
      - traefik_letsencrypt:/letsencrypt
      - /tmp
    secrets:
      - traefik_dashboard_users
    networks:
      - public
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
        - --ping.entrypoint=health
        - --entrypoints.health.address=:8081
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1
        delay: 5s

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.12@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a
    volumes:
      - uptime_data:/app/data
      - /tmp
    networks:
      - public
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
      update_config:
        order: stop-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1
        delay: 5s

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ${DEPLOY_ROOT}/deploy/logging/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
      - /tmp
    networks:
      - internal
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      update_config:
        order: stop-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1
        delay: 5s

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:3.4@sha256:027f9fa5ee70be5836eeaa10ce889d7a83f34a8db16a7f412818b92997e0beab
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      POST: "0"
      AUTH: "0"
      SECRETS: "0"
      CONFIGS: "0"
      SERVICES: "0"
      TASKS: "0"
      NODES: "0"
      SWARM: "0"
      NETWORKS: "1"
      IMAGES: "0"
      VOLUMES: "0"
      SYSTEM: "0"
      EXEC: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /tmp
      - /run
      - /var/lib/haproxy
    networks:
      - internal
    read_only: true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1
        delay: 5s

  alloy:
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - ${DEPLOY_ROOT}/deploy/logging/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/log/ops-deploy:/var/log/ops-deploy:ro
      - /tmp
    networks:
      - internal
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
      update_config:
        order: stop-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1
        delay: 5s

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
    volumes:
      - ${DEPLOY_ROOT}/deploy/logging/grafana-datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - grafana_data:/var/lib/grafana
      - /tmp
    secrets:
      - grafana_admin_password
    networks:
      - public
      - internal
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      update_config:
        order: stop-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1
        delay: 5s

networks:
  public:
    external: true
  internal:
    external: true

volumes:
  traefik_letsencrypt:
  uptime_data:
  loki_data:
  alloy_data:
  grafana_data:

secrets:
  traefik_dashboard_users:
    external: true
  grafana_admin_password:
    external: true
