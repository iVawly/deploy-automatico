APP_NAME=demo-app
APP_DOMAIN=demo.internal.example.com
APP_PORT=8080
APP_HEALTH_PATH=/health
APP_IMAGE_REPO=ghcr.io/example/demo-app
APP_VOLUME=demo-app-data
APP_MOUNT_PATH=/data
# APP_SECRETS="demo_app_database_url"
APP_NETWORK=public
APP_HEALTH_TIMEOUT=5
APP_HEALTH_RETRIES=12
APP_HEALTH_INTERVAL=5
APP_PUBLIC_CHECK_PATH=/
APP_KEEP_PREVIOUS=0
APP_VERIFY_PUBLIC=1
APP_PROBE_IMAGE=curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac

# Runtime hardening. Set APP_READ_ONLY=0 only for images that write outside the volume.
APP_READ_ONLY=1
APP_MEMORY_LIMIT=256M
APP_CPU_LIMIT=0.50
APP_PIDS_LIMIT=128
APP_TMPFS_SIZE=16777216
APP_STOP_GRACE_PERIOD=30s
APP_LOG_MAX_SIZE=10m
APP_LOG_MAX_FILE=3
APP_CAP_DROP=ALL
