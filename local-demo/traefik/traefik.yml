entryPoints:
  web:
    address: ":80"
    http:
      aliasHeadersStrategy: delete
  websecure:
    address: ":443"
    http:
      aliasHeadersStrategy: delete
      tls:
        options: default
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
  health:
    address: ":8081"
    http:
      aliasHeadersStrategy: delete

ping:
  entryPoint: health

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true
  debug: false

global:
  checkNewVersion: false
  sendAnonymousUsage: false

serversTransport:
  forwardingTimeouts:
    dialTimeout: 5s
    responseHeaderTimeout: 30s
    idleConnTimeout: 90s

log:
  level: INFO
  format: json

accessLog:
  format: json
  bufferingSize: 100
  fields:
    headers:
      names:
        X-Request-ID: keep
