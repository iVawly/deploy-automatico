# Local demo routes. TLS uses the Traefik default self-signed certificate.
http:
  routers:
    traefik-dashboard:
      rule: "Host(`traefik.127.0.0.1.nip.io`)"
      entryPoints:
        - websecure
      service: api@internal
      middlewares:
        - dashboard-auth
        - security-headers
        - rate-limit
      tls: {}
    uptime-kuma:
      rule: "Host(`monitor.127.0.0.1.nip.io`)"
      entryPoints:
        - websecure
      service: uptime-kuma
      middlewares:
        - security-headers
        - rate-limit
      tls: {}
    grafana:
      rule: "Host(`grafana.127.0.0.1.nip.io`)"
      entryPoints:
        - websecure
      service: grafana
      middlewares:
        - security-headers
        - rate-limit
      tls: {}
  services:
    uptime-kuma:
      loadBalancer:
        servers:
          - url: "http://uptime-kuma:3001"
    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
  middlewares:
    dashboard-auth:
      basicAuth:
        usersFile: /run/secrets/traefik_dashboard_users
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        customRequestHeaders:
          X-Forwarded-Proto: https
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
