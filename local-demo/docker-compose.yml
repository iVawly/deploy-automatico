# Local demo platform. Not for production: self-signed TLS and local registry.
# Docker Swarm stack in Compose format; the filename lets Dependabot track images.
# Images are pinned by digest so the demo is reproducible.
services:
  registry:
    image: registry:3.1.2@sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - public
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  traefik:
    image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --ping=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DEMO_ROOT}/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${DEMO_ROOT}/dynamic:/etc/traefik/dynamic:ro
      - /tmp
    secrets:
      - traefik_dashboard_users
    networks:
      - public
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
        - --ping.entrypoint=health
        - --entrypoints.health.address=:8081
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
    volumes:
      - uptime_data:/app/data
      - /tmp
    networks:
      - public
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ${PLATFORM_ROOT}/deploy/logging/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
      - /tmp
    networks:
      - internal
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      POST: "0"
      AUTH: "0"
      SECRETS: "0"
      CONFIGS: "0"
      SERVICES: "0"
      TASKS: "0"
      NODES: "0"
      SWARM: "0"
      NETWORKS: "1"
      IMAGES: "0"
      VOLUMES: "0"
      SYSTEM: "0"
      EXEC: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /tmp
      - /run
      - /var/lib/haproxy
    networks:
      - internal
    read_only: true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - ${PLATFORM_ROOT}/deploy/logging/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /tmp
    networks:
      - internal
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: https://grafana.127.0.0.1.nip.io
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
    volumes:
      - ${PLATFORM_ROOT}/deploy/logging/grafana-datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - grafana_data:/var/lib/grafana
      - /tmp
    secrets:
      - grafana_admin_password
    networks:
      - public
      - internal
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  public:
    external: true
  internal:
    external: true

volumes:
  registry_data:
  uptime_data:
  loki_data:
  alloy_data:
  grafana_data:

secrets:
  traefik_dashboard_users:
    external: true
  grafana_admin_password:
    external: true
