name: deploy-demo-app

on:
  push:
    tags:
      - "demo-app-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão SemVer já publicada (ex.: 1.4.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-demo-app
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan (full history)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" gitleaks.tar.gz | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact --no-banner --exit-code 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Tests
        working-directory: apps/demo-app
        run: env PYTHONPATH=. python -m unittest discover -s tests -v

  build-and-deploy:
    needs: test
    runs-on: [self-hosted, linux, deploy]
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#demo-app-v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "versão inválida: $version (use SemVer, nunca latest)" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Resolve image
        run: |
          conf=/opt/deploy-platform/deploy/apps/demo-app/app.conf
          test -r "$conf" || { echo "config ausente: $conf" >&2; exit 1; }
          repo="$(sed -n 's/^APP_IMAGE_REPO=//p' "$conf" | head -n 1)"
          test -n "$repo" || { echo "APP_IMAGE_REPO vazio em $conf" >&2; exit 1; }
          echo "IMAGE=$repo" >> "$GITHUB_ENV"
          echo "REGISTRY=${repo%%/*}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/demo-app
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            CREATED=${{ env.CREATED }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image (keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"

      - name: Deploy
        run: |
          test -x /usr/local/bin/ops-deploy
          /usr/local/bin/ops-deploy deploy demo-app "$VERSION" --digest "${{ steps.build.outputs.digest }}"

      - name: Verify
        run: /usr/local/bin/ops-deploy verify demo-app
