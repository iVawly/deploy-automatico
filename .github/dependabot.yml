version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /apps/demo-app
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels: [dependencies, docker]

  # Compose stacks are tracked by the docker-compose ecosystem; the plain
  # "docker" ecosystem only scans Dockerfiles and Kubernetes manifests.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      platform:
        patterns: ["*"]
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /local-demo
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      local-demo:
        patterns: ["*"]
    labels: [dependencies, docker]
